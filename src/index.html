<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProcessObserver</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ─── Header ─────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-left">
      <span class="app-logo">⚙️</span>
      <h1 class="app-title">ProcessObserver</h1>
    </div>
    <div class="header-right">
      <span id="admin-badge" class="admin-badge" title="Not running as Administrator">
        🔒 Standard
      </span>
    </div>
  </header>

  <!-- ─── Settings Card (Sticky) ─────────────────────────── -->
  <section class="settings-bar">
    <div class="card settings-card">
      <div class="settings-row">
        <div class="settings-group">
          <label for="executable-input" class="stat-label">Target Executable</label>
          <div class="input-with-suggestions">
            <input
              type="text"
              id="executable-input"
              placeholder="e.g. firefox.exe"
              autocomplete="off"
              list="process-suggestions"
            />
            <datalist id="process-suggestions"></datalist>
          </div>
        </div>
        <div class="settings-group">
          <label for="interval-select" class="stat-label">Poll Interval</label>
          <select id="interval-select">
            <option value="500">500 ms</option>
            <option value="1000" selected>1 second</option>
            <option value="2000">2 seconds</option>
            <option value="5000">5 seconds</option>
            <option value="10000">10 seconds</option>
          </select>
        </div>
        <div class="settings-group">
          <label for="retention-select" class="stat-label">Data Retention</label>
          <select id="retention-select">
            <option value="60">1 minute</option>
            <option value="300" selected>5 minutes</option>
            <option value="600">10 minutes</option>
            <option value="1800">30 minutes</option>
            <option value="3600">1 hour</option>
          </select>
        </div>
        <div class="settings-group settings-actions">
          <button id="btn-start" class="btn btn-primary" title="Start monitoring the target process">
            ▶ Start
          </button>
          <button id="btn-stop" class="btn btn-danger" title="Stop the active monitoring session" disabled>
            ■ Stop
          </button>
        </div>
      </div>
      <div class="settings-row settings-row-secondary">
        <label class="toggle-label" title="Network monitoring requires Administrator privileges">
          <input type="checkbox" id="network-toggle" />
          <span class="toggle-text">Enable Network Monitoring</span>
          <span class="toggle-hint">(requires Admin)</span>
        </label>
        <span id="network-status" class="network-status-indicator"></span>
      </div>
    </div>
  </section>

  <!-- ─── Tab Bar ────────────────────────────────────────── -->
  <nav class="tab-bar" id="tab-bar">
    <div class="tab-placeholder">No active sessions. Start monitoring to begin.</div>
  </nav>

  <!-- ─── Tab Content Area ───────────────────────────────── -->
  <main class="tab-content-area" id="tab-content">
    <div class="empty-state">
      <div class="empty-state-icon">📊</div>
      <h2>Welcome to ProcessObserver</h2>
      <p>Enter an executable name above and click <strong>Start</strong> to begin monitoring.</p>
      <p class="empty-hint">You can monitor multiple executables simultaneously — each gets its own tab.</p>
    </div>
  </main>

  <!-- ─── Hidden template for session tabs ───────────────── -->
  <template id="session-tab-template">
    <div class="session-view" data-session-id="">
      <!-- Stats Row -->
      <div class="stats-grid">
        <div class="card stat-card" data-metric="cpu">
          <div class="card-header">
            <h3>CPU Usage</h3>
            <span class="status-dot active"></span>
          </div>
          <div class="stat-value" id="stat-cpu">0.00</div>
          <div class="stat-unit">%</div>
          <div class="stat-sub">
            <span>Max: <strong class="max-val">0.00</strong>%</span>
            <span>Avg: <strong class="avg-val">0.00</strong>%</span>
          </div>
        </div>
        <div class="card stat-card" data-metric="ram">
          <div class="card-header">
            <h3>Memory (RAM)</h3>
            <span class="status-dot active"></span>
          </div>
          <div class="stat-value" id="stat-ram">0.00</div>
          <div class="stat-unit">MB</div>
          <div class="stat-sub">
            <span>Max: <strong class="max-val">0.00</strong> MB</span>
            <span>Avg: <strong class="avg-val">0.00</strong> MB</span>
          </div>
        </div>
        <div class="card stat-card" data-metric="io">
          <div class="card-header">
            <h3>Disk I/O</h3>
            <span class="status-dot active"></span>
          </div>
          <div class="stat-value" id="stat-io">0 B/s</div>
          <div class="stat-unit">read + write</div>
          <div class="stat-sub">
            <span>Read: <strong class="total-read">0 B</strong></span>
            <span>Write: <strong class="total-write">0 B</strong></span>
            <span>Max: <strong class="max-val">0 B/s</strong></span>
            <span>Avg: <strong class="avg-val">0 B/s</strong></span>
          </div>
        </div>
        <div class="card stat-card" data-metric="net">
          <div class="card-header">
            <h3>Network</h3>
            <span class="status-dot degraded"></span>
          </div>
          <div class="stat-value" id="stat-net">N/A</div>
          <div class="stat-unit" id="stat-net-unit">received + sent</div>
          <div class="stat-sub">
            <span class="net-detail-bytes">Recv: <strong class="total-recv">0 B</strong></span>
            <span class="net-detail-bytes">Sent: <strong class="total-sent">0 B</strong></span>
            <span class="net-detail-conn" style="display:none;">Connections: <strong class="total-conn">0</strong></span>
            <span>Max: <strong class="max-val">0 B/s</strong></span>
            <span>Avg: <strong class="avg-val">0 B/s</strong></span>
          </div>
        </div>
      </div>

      <!-- Graphs Grid -->
      <div class="graphs-grid">
        <div class="card graph-card">
          <div class="card-header">
            <h3>CPU Usage Over Time</h3>
            <span class="graph-legend" style="color: var(--accent-blue);">● CPU %</span>
          </div>
          <div class="graph-container">
            <canvas class="graph-canvas" data-metric="cpu"></canvas>
          </div>
        </div>
        <div class="card graph-card">
          <div class="card-header">
            <h3>Memory Usage Over Time</h3>
            <span class="graph-legend" style="color: var(--accent-green);">● RAM MB</span>
          </div>
          <div class="graph-container">
            <canvas class="graph-canvas" data-metric="ram"></canvas>
          </div>
        </div>
        <div class="card graph-card">
          <div class="card-header">
            <h3>Disk I/O Over Time</h3>
            <span class="graph-legend">
              <span style="color: #d29922;">● Read</span>
              <span style="color: #39c5cf;">● Write</span>
              <span style="color: var(--text-secondary);">B/s</span>
            </span>
          </div>
          <div class="graph-container">
            <canvas class="graph-canvas" data-metric="io"></canvas>
          </div>
        </div>
        <div class="card graph-card">
          <div class="card-header">
            <h3>Network Traffic Over Time</h3>
            <span class="graph-legend net-legend"></span>
          </div>
          <div class="net-degraded-banner" style="display:none;">
            ⚠ Degraded mode — showing active TCP connection counts (approximate).
          </div>
          <div class="graph-container">
            <canvas class="graph-canvas" data-metric="net"></canvas>
          </div>
        </div>
      </div>

      <!-- Footer Bar -->
      <div class="session-footer">
        <div class="footer-left">
          <span class="session-info">PID: <strong class="pid-display">—</strong></span>
          <span class="session-info">⏱ <strong class="elapsed-display">00:00:00</strong></span>
        </div>
        <div class="footer-right">
          <div class="export-group">
            <select class="export-format-select btn-sm">
              <option value="csv">CSV</option>
              <option value="json">JSON</option>
            </select>
            <button class="btn btn-secondary btn-sm btn-export">📥 Export Data</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
